<!DOCTYPE html>
<html>
<head>
    <title>Snake Game Level</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Snake Game</h1>

    <canvas id="game" width="400" height="400"></canvas>
    
    <!-- SCORE & LEVEL DI LUAR CANVAS -->
    <p id="scoreDisplay" style="font-size:14px; margin:4px;">Score : 0 &nbsp;|&nbsp; Level : Level 1</p>

    <!-- PANEL LEVEL -->
    <div id="levelPanel" class="hidden">
        <h2 id="levelText"></h2>
        <p id="scoreText"></p>
        
        <button id="nextLevelBtn">
        Mulai Level Selanjutnya
        </button>
    </div>
    <script src="game.js"></script>
</body>
</html>
